<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Pago</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <style>
    body {
      background-color: #f1f3f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .payment-card {
      border: none;
      border-radius: 10px;
      overflow: hidden;
    }

    .card-header-custom {
      border-bottom: 1px solid #e9ecef;
      background-color: #ffffff;
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
    }

    .accept-box {
      background-color: #6c757d;
      padding: 10px 14px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .accept-box label {
      color: #ffffff;
      cursor: pointer;
      margin: 0;
      font-size: 1.2rem;
    }

    .accept-box input[type="radio"] {
      margin-right: 4px;
      cursor: pointer;
    }

    textarea {
      resize: none;
    }

    .card-footer-custom {
      background-color: #ffffff;
      border-top: 1px solid #e9ecef;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <div class="card shadow payment-card">
      <div class="card-header card-header-custom">
        Payment form example
      </div>

      <div class="card-body">
        <div class="alert alert-danger mb-4" role="alert">
          Some fields are missing
        </div>

        <form>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="cardNumber" class="form-label">Card #</label>
              <input type="text" class="form-control" id="cardNumber" placeholder="XXXXXXXXXXXXXXXX" />
            </div>

            <div class="col-md-3">
              <label for="cvcNumber" class="form-label">CVC #</label>
              <input type="text" class="form-control" id="cvcNumber" placeholder="0000" />
            </div>

            <div class="col-md-3">
              <label for="amount" class="form-label">Amount</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="text" class="form-control" id="amount" placeholder="Amount" />
              </div>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" />
            </div>

            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" />
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" />
            </div>

            <div class="col-md-3">
              <label for="state" class="form-label">State</label>
              <select class="form-select" id="state">
                <option selected disabled>Pick a state</option>
                <option>California</option>
                <option>Texas</option>
                <option>Florida</option>
                <option>New York</option>
              </select>
            </div>

            <div class="col-md-3">
              <label for="postalCode" class="form-label">Postal Code</label>
              <input type="text" class="form-control" id="postalCode" />
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label d-block">We accept:</label>

              <div class="accept-box">
                <div>
                  <input type="radio" name="cardType" id="visa" />
                  <label for="visa">
                    <i class="bi bi-credit-card"></i>
                  </label>
                </div>

                <div>
                  <input type="radio" name="cardType" id="mastercard" />
                  <label for="mastercard">
                    <i class="bi bi-credit-card-2-front"></i>
                  </label>
                </div>

                <div>
                  <input type="radio" name="cardType" id="amex" />
                  <label for="amex">
                    <i class="bi bi-credit-card-2-back"></i>
                  </label>
                </div>

                <div>
                  <input type="radio" name="cardType" id="discover" />
                  <label for="discover">
                    <i class="bi bi-credit-card-fill"></i>
                  </label>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="3" placeholder="Add any notes here..."></textarea>
              <small class="text-muted">Add any notes here.</small>
            </div>
          </div>
        </form>
      </div>

      <div class="card-footer card-footer-custom text-end">
        <div class="dropdown d-inline me-2">
          <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            Cancel
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Clear Fields</a></li>
            <li><a class="dropdown-item" href="#">Reset Form</a></li>
          </ul>
        </div>

        <div class="dropdown d-inline">
          <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Send
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Confirm Payment</a></li>
            <li><a class="dropdown-item" href="#">Save for Later</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
